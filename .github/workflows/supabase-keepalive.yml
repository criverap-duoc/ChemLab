name: Supabase Keepalive

on:
  schedule:
    # Cada 3 días a las 06:00 UTC (suficiente para resetear el timer de 7 días)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Permite ejecución manual

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ChemLab public inventory (real DB query)
        run: |
          curl -f -s -o /dev/null -w "HTTP %{http_code}\n" \
            -H "X-Api-Key: ${{ secrets.CHEMLAB_PUBLIC_API_KEY }}" \
            "https://chemlab-vozz.onrender.com/api/public/inventory?pageSize=1"